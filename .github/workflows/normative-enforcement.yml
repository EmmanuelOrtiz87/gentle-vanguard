name: Normative Enforcement

permissions:
  contents: read

concurrency:
  group: normative-enforcement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop, main]
    paths:
      - 'scripts/**'
      - 'rules/**'
      - 'config/**'
      - '.github/workflows/normative-enforcement.yml'
  pull_request:
    types: [opened, synchronize]
    branches: [develop, main]
    paths:
      - 'scripts/**'
      - 'rules/**'
      - 'config/**'
  schedule:
    # Lunes 6am UTC = 3am ART (GMT-3)
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  normative-audit:
    name: Normative Compliance Audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Configure Git for Windows
        shell: bash
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run normative audit pipeline
        shell: pwsh
        run: |
          $pipeline = '.\scripts\utilities\normative-audit-pipeline.ps1'
          if (-not (Test-Path $pipeline)) {
            Write-Output "::warning::normative-audit-pipeline.ps1 not found — skipping"
            exit 0
          }
          & $pipeline -Mode ci
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Output "::error::Normative audit failed with exit code $exitCode"
            exit $exitCode
          }
          Write-Output "::notice::Normative audit passed"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normative-audit-report
          path: .session/input-violations.jsonl
          retention-days: 30
