name: Coverage

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/**/*.ts'
      - 'src/**/*.ts'
      - 'tests/**/*.spec.js'
      - 'package.json'
  pull_request:
    branches: [develop, main]
    paths:
      - 'scripts/**/*.ts'
      - 'src/**/*.ts'
      - 'tests/**/*.spec.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  coverage:
    name: JS/TS Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run coverage
        run: pnpm coverage
  pester-coverage:
    name: Pester PS Coverage
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Pester
        run: Install-Module Pester -Force -SkipPublisherCheck
      - name: Run Pester coverage
        run: ./scripts/run-tests-simple.ps1 -WithCoverage
