name: Gentle-Vanguard CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  validate:
    name: Validate Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run typecheck
        working-directory: apps/web-dashboard

      - name: Build dashboard
        run: pnpm run build
        working-directory: apps/web-dashboard

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

  watchtower:
    name: Watchtower Health Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: azure/setup-powershell@v2
        with:
          ps-version: '7.4'

      - name: Run Watchtower
        shell: pwsh
        run: |
          & ./scripts/maintenance/maintenance-watchtower.ps1 -Action health

  test-embeddings:
    name: Test ML Embeddings
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: azure/setup-powershell@v2
        with:
          ps-version: '7.4'

      - name: Test incremental embedder
        shell: pwsh
        run: |
          & ./scripts/utilities/agents/AUTO-DELEGATION/skill-embedder-incremental.ps1 -Quiet

  test-engram:
    name: Test Engram Auto-Compact
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: azure/setup-powershell@v2
        with:
          ps-version: '7.4'

      - name: Test auto-compact (dry-run)
        shell: pwsh
        run: |
          & ./scripts/utilities/memory/ENGRAM/engram-auto-compact.ps1 -DryRun -Quiet

  test-watchtower-trends:
    name: Test Watchtower Trends
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: azure/setup-powershell@v2
        with:
          ps-version: '7.4'

      - name: Record health check
        shell: pwsh
        run: |
          & ./scripts/utilities/monitoring/PREDICTIVE/watchtower-trends.ps1 -Action record -Quiet

      - name: Show trends
        shell: pwsh
        run: |
          & ./scripts/utilities/monitoring/PREDICTIVE/watchtower-trends.ps1 -Action trend -Quiet

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate, watchtower, test-embeddings, test-engram, test-watchtower-trends]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(cat package.json | grep '"version"' | head -1 | sed 's/.*"\([0-9.]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gentle-Vanguard v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
