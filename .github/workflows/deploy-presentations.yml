# Deploy Presentations Book
# Builds and deploys docs/presentations/ to GitHub Pages.
# NOTE: Requires GitHub Pages enabled with source "GitHub Actions" in
# repo settings. Disabled on push triggers because the current plan does
# not support Pages (422: "Your current plan does not support GitHub
# Pages for this repository"); run manually once Pages is available.
# -------------------------------------------------------------------
# Badge: ![status](https://img.shields.io/github/actions/workflow/status/<owner>/<repo>/deploy-presentations.yml?label=Presentations)

name: 'Deploy Presentations Book'

on:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if:
      github.repository_owner == github.event.repository.owner.login &&
      !github.event.repository.fork

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/presentations

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
