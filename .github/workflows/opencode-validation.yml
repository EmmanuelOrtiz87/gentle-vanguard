name: OpenCode Validation

on:
  pull_request:
    paths:
      - 'opencode.json'
      - '.opencode/**'
      - 'src/**'
      - 'tests/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: node --version && node --test tests/unit/opencode-guards.test.ts

      - name: Run integration tests
        run: node --test tests/integration/opencode-validation.test.ts

      - name: Validate OpenCode (integration)
        run: pnpm exec tsx src/hooks/validate-opencode-all.ts

      - name: Check OpenCode validation alerts
        run: pnpm exec tsx src/monitor/opencode-validation-monitor.ts
