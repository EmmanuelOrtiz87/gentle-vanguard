name: Stale Issues & PRs

permissions:
  issues: write
  pull-requests: write
  contents: read

on:
  schedule:
    - cron: '30 5 * * 1' # Weekly on Monday at 02:30 GMT-3 (05:30 UTC)
  workflow_dispatch:

jobs:
  stale:
    name: Close stale items
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164dbbb639
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been inactive for 30 days. Marked as stale. Remove stale label or comment to keep it open.'
          stale-pr-message: 'This PR has been inactive for 14 days. Marked as stale. Remove stale label or comment to keep it open.'
          close-issue-message: 'Closed due to 7 more days of inactivity. Feel free to reopen if needed.'
          close-pr-message: 'Closed due to 7 more days of inactivity. Feel free to reopen if needed.'
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug,enhancement'
          exempt-pr-labels: 'pinned,security,dependencies'
          operations-per-run: 100
