name: Reusable Test

on:
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  unit:
    name: Unit Tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Node tests
        run: pnpm test
      - name: Run Go tests
        shell: pwsh
        run: |
          where.exe go 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Go modules live in subdirectories (no go.mod at repo root)
            $modules = @('demos/shared/task-tracker', 'scripts/utilities/model-router-tui', 'tests/go-tests')
            foreach ($m in $modules) {
              Write-Host "=== go test ./... ($m) ==="
              Push-Location $m
              go test ./...
              $code = $LASTEXITCODE
              Pop-Location
              if ($code -ne 0) { exit $code }
            }
          }

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Docker Compose Integration
        run: |
          docker compose -f docker-compose.test.yml build
          docker compose -f docker-compose.test.yml up --exit-code-from integration-test

  # dashboard: REMOVED — apps are local-first products (ADR-0017), untracked
  # from this repo. They run their own tests locally via the Command Center
  # harness (apps/ has its own git repo).

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run e2e tests
        run: npx tsx --test tests/e2e/*.test.ts

  phase-connectors:
    name: Phase 1.2 Cloud Connector Tests (disabled — local-only mode, ADR-0017)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false # disabled — Cloud Connector is opt-in (CLOUD_CONNECTOR_ENABLED != true). Enable by removing this line when activating AWS/Azure.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run cloud connector tests
        run: pnpm test -- cloud-connectors

  phase-integration:
    name: Phase Integration Tests (Tracing, State, Audit)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run integration tests for phases 1.3, 2, 3
        run: pnpm test:phase-integration

  smoke:
    name: Smoke Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run stack smoke tests
        run: pnpm test:smoke
      - name: Run script smoke tests
        run: pnpm test:scripts-smoke

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
