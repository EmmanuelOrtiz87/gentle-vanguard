openapi: 3.0.0
info:
  title: '{{project-name}}'
  version: '1.0.0'
  description: '{{project-description}}'
  license:
    name: '{{license}}'
    url: '{{license-url}}'
servers:
  - url: '{base-url}'
    description: Production server
    variables:
      base-url:
        default: '{{base-url}}'
        description: Replace {{base-url}} with the deployed API base URL
paths: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - BearerAuth: []
