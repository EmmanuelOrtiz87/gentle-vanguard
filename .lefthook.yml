# lefthook.yml v3.1 — Git hooks for Gentle-Vanguard (PS1→TS)
# All hooks migrated from PowerShell to TypeScript

post-commit:
  commands:
    codegraph-sync:
      run: npx tsx src/codegraph-post-modification-sync.ts --Trigger post-commit --Force
    hashline-snapshot:
      run: npx tsx src/infrastructure/hashline-snapshot-hook.ts

post-merge:
  commands:
    codegraph-sync:
      run: npx tsx src/codegraph-post-modification-sync.ts --Trigger post-merge --Force
    post-merge-install:
      glob: 'package.json'
      run: pnpm install --ignore-scripts

pre-commit:
  commands:
    opencode-validation:
      glob: '*.json'
      run: npx tsx src/hooks/pre-commit-opencode-validation.ts {staged_files}
    json-lint:
      glob: '*.json'
      run: npx tsx src/json-lint.ts {staged_files}
    workflow-lint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: npx tsx src/workflow-lint.ts {staged_files}
    lockfile-lint:
      glob: 'package-lock.json'
      run: npx tsx src/lockfile-lint-pre-commit.ts
    trufflehog-scan:
      glob: '*.{ts,js,json,yml,yaml,md,env,toml,xml,py,ps1,sh,sql}'
      run:
        trufflehog filesystem --no-verification --no-update --fail=false --exclude-paths
        .trufflehogignore {staged_files} || exit 0
    skill-scan:
      glob: '{.opencode/,}skills/*/SKILL.md'
      run: npx tsx src/scan-skill-hook.ts --StagedFiles '{staged_files}'
    secretlint:
      glob: '*.{json,yml,yaml,md,env,toml,xml}'
      run: npx secretlint --secretlintrc .secretlintrc.json {staged_files} 2>&1
    secret-scanner:
      glob: '*.{ts,js,json,yml,yaml,md,env,toml,xml,py,ps1,sh,sql}'
      run: npx tsx src/secret-scanner-cli.ts --scan {staged_files} --redact

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    lint:
      run: pnpm lint
    audit-check:
      run: npx tsx src/infrastructure/siem-audit-bridge.ts --Scope quick
    orchestrator-auto-fix:
      run: npx tsx src/orchestrate-auto-fix.ts --Fix
    npm-audit:
      glob: 'package.json'
      run: npx tsx src/infrastructure/npm-audit-pre-push.ts --AuditLevel moderate
    # Perf baseline validation — self-skips (exit 0) when tests/performance/baseline.json
    # is missing or when --skip is passed, per config/alert policy in baseline.json
    perf-baseline:
      run: npm run perf:baseline:check
    # Code coverage gate — quick mode (~5s, core suites only). Informational:
    # quick mode never fails the push (aggregate enforcement is full-mode only).
    # --no-write: validate without touching reports/coverage-summary.json (keeps
    # the working tree clean so the push is not aborted by a dirty tree).
    coverage-gate:
      run: npm run coverage:quick -- --no-write

commit-msg:
  commands:
    commitlint:
      run: npx tsx src/hooks/commitlint.ts {1}
    commit-msg-session-track:
      run: npx tsx src/hooks/commit-msg-session-track-hook.ts --CommitMsgFile {1}
