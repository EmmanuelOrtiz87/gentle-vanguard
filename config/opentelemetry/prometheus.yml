global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    metrics_path: /metrics

  - job_name: 'gentle-vanguard-dashboard'
    static_configs:
      - targets: ['web-dashboard:8080']
    metrics_path: /api/metrics

  - job_name: 'gentle-vanguard-ws'
    static_configs:
      - targets: ['websocket-server:8081']
    metrics_path: /api/health

  - job_name: 'gentle-vanguard-health'
    static_configs:
      - targets: ['health-api:9090']
    metrics_path: /health
