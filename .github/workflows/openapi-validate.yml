name: OpenAPI Validate

permissions:
  contents: read

concurrency:
  group: openapi-validate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - '**/*openapi*'
      - '**/*.yaml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate OpenAPI specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install openapi-validator
        run: pnpm add -g @apidevtools/swagger-cli
      - name: Validate OpenAPI files
        run: |
          $files = Get-ChildItem -Recurse -Filter 'openapi*.yaml' | Where-Object { $_.FullName -notmatch 'node_modules' }
          if ($files.Count -eq 0) {
            Write-Host "No OpenAPI files found"
            exit 0
          }
          $exitCode = 0
          foreach ($file in $files) {
            Write-Host "Validating $($file.FullName)..."
            swagger-cli validate $file.FullName
            if ($LASTEXITCODE -ne 0) { $exitCode = 1 }
          }
          exit $exitCode
        shell: pwsh
