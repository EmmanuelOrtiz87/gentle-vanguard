name: Experimental Modules Gates

on:
  pull_request:
    branches: [develop]

jobs:
  validate-experimental-gates:
    name: Validate experimental module gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Node.js
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22'

      - name: Enable corepack and install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run config tests
        run: pnpm test:config

      - name: Run typecheck
        run: pnpm typecheck

      - name: Enforce experimental policy
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('config/stack-maturity.json','utf8')); if(c.policy?.experimentalModules!=='opt-in' || c.policy?.requireApprovalForExperimental!==true){console.error('Experimental policy not set to opt-in with required approvals'); process.exit(1);} if(!Array.isArray(c.governance?.requiredForExperimental)){console.error('Governance.requiredForExperimental missing'); process.exit(1);} console.log('Experimental policy and governance gates OK');"

      - name: Validate all experimental module gates
        run: npx tsx src/module-maturity.ts --validate-all

      - name: Optional security scan (best-effort)
        run: |
          if command -v pnpm >/dev/null 2>&1; then pnpm secretlint --max-warnings=0 || true; fi
