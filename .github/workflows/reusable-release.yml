name: Reusable Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Generate Release Notes
        id: notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          git log --oneline --no-decorate $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build-installer:
    name: Build Binario (.exe SEA)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile TS (dist/)
        run: pnpm build:mcp
      - name: Install postject (SEA injection)
        run: npm install -g postject
      - name: Build SEA launcher
        run: npx tsx src/build-sea.ts --target launcher --skip-build
        shell: pwsh
      - name: Prepare versioned asset
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}".TrimStart('v')
          $asset = "build/gentle-vanguard-$version.exe"
          Copy-Item -Path "build/Gentle-Vanguard.exe" -Destination $asset -Force
          Write-Output "Asset listo: $asset"
          Get-ChildItem build/gentle-vanguard-*.exe
      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: build/gentle-vanguard-*.exe
