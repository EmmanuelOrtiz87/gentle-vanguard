name: Scheduled Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false

jobs:
  governance:
    uses: ./.github/workflows/reusable-governance.yml
    permissions:
      contents: read
      pull-requests: write

  stale:
    name: Close Stale Items
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: 'This issue has been stale for 60 days. Closing in 14 days.'
          stale-pr-message: 'This PR has been stale for 60 days. Closing in 14 days.'

  watchtower:
    name: Maintenance Watchtower
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Run maintenance checks
        run: |
          # Check for outdated deps
          if (Test-Path "package.json") {
            npm outdated 2>$null | Out-Null
          }
          # Check for large files
          $largeFiles = Get-ChildItem -Recurse -File | Where-Object { $_.Length -gt 50MB }
          if ($largeFiles) { Write-Warning "Large files found: $($largeFiles.Count)" }
          # Check temp files
          $tempFiles = Get-ChildItem -Recurse -Filter "*.tmp" -Name
          if ($tempFiles) { Remove-Item $tempFiles -Force; Write-Host "Cleaned $($tempFiles.Count) temp files" }

  chaos:
    name: Chaos Engineering (L4 — automated resilience)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run chaos experiments (safe restore guaranteed)
        run: npx tsx src/tools/chaos-engineering.ts run-all --json
      - name: Verify experiments passed
        run: |
          $results = Get-Content .session/chaos/results.json | ConvertFrom-Json
          $failed = @($results.results | Where-Object { $_.status -eq 'FAILED' })
          if ($failed.Count -gt 0) {
            Write-Error "Chaos experiments failed: $($failed.Count)"
            exit 1
          }
          Write-Host "Chaos OK: $($results.results.Count) experiments, $($failed.Count) failed"

  monthly-report:
    name: Monthly Management Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event.schedule == '0 6 1 * *'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Generate report
        shell: pwsh
        run: |
          $commits = git log --oneline --since="30 days ago" | Measure-Object
          $authors = git shortlog -sn --since="30 days ago" | Measure-Object
          echo "Commits (30d): $($commits.Count)"
          echo "Authors (30d): $($authors.Count)"
