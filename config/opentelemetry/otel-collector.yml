receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 100
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes:
    actions:
      - key: service.name
        value: gentle-vanguard
        action: upsert
      - key: deployment.environment
        value: production
        action: upsert
  filter:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.method"] == "OPTIONS"'
  probabilistic_sampler:
    hash_seed: 42
    sampling_percentage: 100.0

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: gentle_vanguard
    resource_to_telemetry_conversion:
      enabled: true
  file/stdout:
    path: /workspace/.telemetry/traces/traces.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes, filter]
      exporters: [debug, otlp, file/stdout]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [debug, prometheus]
  telemetry:
    logs:
      level: info
