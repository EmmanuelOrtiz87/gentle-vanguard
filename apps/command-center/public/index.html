<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gentle-Vanguard — Command Center</title>
    <style>
      :root {
        --primary: #00bfff;
        --primary-light: #4dcfff;
        --primary-dark: #0055bb;
        --accent: #a855f7;
        --bg: #0d1117;
        --surface: #1a2035;
        --icon: #2a2d3a;
        --text: #fff;
        --muted: #6b7280;
        --border: #1e3a5f;
        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
        --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
        --mono: 'JetBrains Mono', 'Cascadia Code', monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 80% 0%, #102b45 0, #0d1117 38%);
        color: var(--text);
        font-family: var(--font);
      }
      main {
        max-width: 1180px;
        margin: auto;
        padding: 42px 24px 64px;
      }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0;
        color: var(--primary);
        font-size: clamp(25px, 4vw, 42px);
        letter-spacing: -0.03em;
      }
      header p {
        margin: 8px 0 0;
        color: var(--muted);
      }
      button {
        font: inherit;
        cursor: pointer;
        color: var(--text);
        border: 1px solid var(--border);
        background: var(--icon);
        border-radius: 8px;
        padding: 10px 14px;
        transition: 0.15s;
      }
      button:hover:not(:disabled) {
        border-color: var(--primary);
        box-shadow: 0 0 18px #00bfff33;
      }
      button:focus-visible {
        outline: 3px solid var(--primary-light);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      .refresh {
        white-space: nowrap;
      }
      .presets {
        display: flex;
        gap: 9px;
        margin: -12px 0 20px;
      }
      .preset-stop {
        border-color: #7f1d1d;
      }
      .notice {
        padding: 12px 15px;
        border: 1px solid var(--error);
        color: #fecaca;
        background: #3b1418;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }
      .card {
        background: linear-gradient(145deg, #1a2035ee, #121a2aee);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 22px;
        box-shadow: 0 14px 30px #0003;
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .card h2 {
        margin: 0 0 7px;
        font-size: 21px;
      }
      .description {
        margin: 0;
        color: #aab4c6;
        font-size: 14px;
        line-height: 1.5;
      }
      .badge {
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 700;
        height: max-content;
        text-transform: uppercase;
      }
      .running {
        color: #bbf7d0;
        background: #14532d;
      }
      .stopped {
        color: #cbd5e1;
        background: #334155;
      }
      .partial {
        color: #fde68a;
        background: #78350f;
      }
      .processes {
        margin: 22px 0 18px;
        padding-top: 14px;
        border-top: 1px solid #ffffff12;
        font: 12px var(--mono);
        color: #aab4c6;
      }
      .process {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 0;
      }
      .up {
        color: var(--success);
      }
      .down {
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 9px;
      }
      .power {
        background: var(--primary-dark);
        border-color: var(--primary);
      }
      .open {
        flex: 1;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 40px;
      }
      .meta {
        font: 11px var(--mono);
        color: var(--muted);
        margin-top: 28px;
        text-align: right;
      }
      @media (max-width: 600px) {
        main {
          padding: 28px 15px;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        .refresh {
          width: 100%;
        }
        .process {
          flex-direction: column;
          gap: 2px;
        }
        .actions {
          flex-wrap: wrap;
        }
        .actions button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Gentle-Vanguard — Command Center</h1>
          <p>Inicia, detén y abre las aplicaciones del stack bajo demanda.</p>
        </div>
        <button class="refresh" id="refresh" aria-label="Actualizar aplicaciones">
          ↻ Actualizar
        </button>
      </header>
      <div class="presets" aria-label="Presets">
        <button id="start-all" onclick="preset('start-all')">⏻ Arrancar todo</button>
        <button id="stop-all" class="preset-stop" onclick="preset('stop-all')">
          ⏹ Detener todo
        </button>
      </div>
      <div id="error" class="notice" role="alert" hidden></div>
      <section id="apps" class="grid" aria-live="polite">
        <div class="empty">Cargando aplicaciones…</div>
      </section>
      <div class="meta">Actualización automática cada 5 segundos · solo loopback</div>
    </main>
    <script>
      // Surface ANY unexpected error in the UI — a silent failure here would
      // leave the grid stuck at "Cargando aplicaciones…" with no visible cause.
      window.onerror = function (msg, src, line) {
        try {
          show(String(msg) + ' (' + String(src).split('/').pop() + ':' + line + ')');
        } catch {}
        return false;
      };
      window.addEventListener('unhandledrejection', function (ev) {
        show(ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason));
      });
      const labels = { running: 'En ejecución', stopped: 'Detenida', partial: 'Parcial' };
      let busy = '';
      let presetBusy = false;
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      async function load() {
        try {
          const r = await fetch('/api/apps');
          if (!r.ok) throw Error('HTTP ' + r.status);
          render(await r.json());
          document.querySelector('#error').hidden = true;
        } catch (e) {
          show(e.message);
        }
      }
      function show(message) {
        const e = document.querySelector('#error');
        e.textContent = 'No se pudieron cargar las aplicaciones: ' + message;
        e.hidden = false;
      }
      function render(apps) {
        window.currentApps = apps;
        document.querySelector('#apps').innerHTML =
          apps
            .map(
              (a) =>
                `<article class="card"><div class="card-top"><div><h2>${esc(a.name)}</h2><p class="description">${esc(a.description)}</p></div><span class="badge ${a.status}">${labels[a.status]}</span></div><div class="processes">${a.processes.map((p) => `<div class="process"><span>${esc(p.name)}</span><span class="${p.alive ? 'up' : 'down'}">${p.alive ? 'PID ' + (p.pid || '—') + ' · Puerto ' + p.port : 'Puerto ' + p.port + ' · Sin conexión'}</span></div>`).join('')}</div><div class="actions"><button class="power" ${busy || presetBusy ? 'disabled' : ''} onclick="toggle('${a.id}','${a.status}')" aria-label="${a.status === 'running' ? 'Detener' : 'Iniciar'} ${esc(a.name)}">⏻ ${a.status === 'running' ? 'Detener' : 'Iniciar'}</button><button class="open" onclick="window.open('${a.url}','_blank','noopener,noreferrer')" aria-label="Abrir ${esc(a.name)}">↗ Abrir</button></div></article>`,
            )
            .join('') || '<div class="empty">No hay aplicaciones registradas.</div>';
      }
      async function toggle(id, status) {
        if (status === 'running' && !confirm('¿Detener esta aplicación?')) return;
        busy = id;
        try {
          const r = await fetch(
            '/api/apps/' + encodeURIComponent(id) + '/' + (status === 'running' ? 'stop' : 'start'),
            { method: 'POST' },
          );
          if (!r.ok) throw Error('HTTP ' + r.status);
          await load();
        } catch (e) {
          show(e.message);
        } finally {
          busy = '';
          await load();
        }
      }
      async function preset(name) {
        if (name === 'stop-all') {
          const apps = await fetch('/api/apps')
            .then((r) => r.json())
            .catch(() => []);
          const running = apps.filter((app) => app.status === 'running').length;
          if (!confirm('¿Detener ' + running + ' aplicaciones en ejecución?')) return;
        }
        presetBusy = true;
        document.querySelector('#start-all').disabled = true;
        document.querySelector('#stop-all').disabled = true;
        render(window.currentApps || []);
        try {
          const r = await fetch('/api/presets/' + name, { method: 'POST' });
          if (!r.ok) throw Error('HTTP ' + r.status);
          await load();
        } catch (e) {
          show(e.message);
        } finally {
          presetBusy = false;
          document.querySelector('#start-all').disabled = false;
          document.querySelector('#stop-all').disabled = false;
          await load();
        }
      }
      // Bootstrap: initial load + 5s polling (matches the footer promise).
      // Without this the script only defines functions and the grid stays at
      // "Cargando aplicaciones…" forever — no error, no render.
      void load();
      setInterval(() => void load(), 5000);
    </script>
  </body>
</html>
