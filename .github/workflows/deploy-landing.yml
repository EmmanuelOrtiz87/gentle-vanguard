name: Deploy Academy Landing

# Deploya la landing pública de Academy a GitHub Pages.
# Requiere: Settings → Pages → Source: GitHub Actions.
# La URL final es https://<owner>.github.io/<repo>/ (o dominio custom).

on:
  push:
    branches: [main]
    paths:
      - 'apps/academy-landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio (landing ya committeada y regenerada localmente)
        run: |
          mkdir -p _site/academy-landing
          cp -r apps/academy-landing/* _site/academy-landing/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
