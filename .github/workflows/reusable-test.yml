name: Reusable Test

on:
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  unit:
    name: Unit Tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -PassThru
          Invoke-Pester -Path tests/unit/ -Passthru -Output Detailed
      - name: Run Node tests
        run: pnpm test
      - name: Run Go tests
        shell: pwsh
        run: |
          where.exe go 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { go test ./... }

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Docker Compose Integration
        run: |
          docker compose -f docker-compose.test.yml build
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from node-tests

  dashboard:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dashboard
        working-directory: apps/web-dashboard
        run: pnpm build
      - name: Lint dashboard
        working-directory: apps/web-dashboard
        run: pnpm lint

  phase-connectors:
    name: Phase 1.2 Cloud Connector Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run cloud connector tests
        run: pnpm test -- cloud-connectors

  phase-integration:
    name: Phase Integration Tests (Tracing, State, Audit)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Pester
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -PassThru
      - name: Run integration tests for phases 1.3, 2, 3
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -PassThru
          Invoke-Pester -Path tests/integration/phase-13-2-3/ -Passthru -Output Detailed

  smoke:
    name: Smoke Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Pester
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -PassThru
      - name: Run stack smoke tests
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -PassThru
          Invoke-Pester -Path tests/smoke/ -Pashtru -Output Detailed

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
