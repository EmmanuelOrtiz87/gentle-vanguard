name: CI

# Single CI entrypoint — replaces the former ci.yml + pr.yml + push-checks.yml +
# security.yml overlap (lint/tests/security used to run twice per PR).
# Unique jobs from those workflows (labeler, docker, governance) live here now.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.15.1'

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/reusable-lint.yml

  test:
    name: Test
    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write

  security:
    name: Security
    uses: ./.github/workflows/reusable-security-scan.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write

  # production-gate — the single authoritative delivery gate.
  # Consolidates typecheck/lint/tests/secret-scan/workflow-lint/SBOM into one
  # required check. This is the check the branch ruleset should require.
  production-gate:
    name: Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cosign (syft/grype signature verification)
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: Install Syft + Grype (container-scan gate toolchain)
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/anchore/syft/af937d74c00c26374449e81aa4ff45ae2d668a33/install.sh | sh -s -- -b /usr/local/bin -v v1.51.1
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/anchore/grype/f6f2ce0a2293e65c97bf5468926cb0c9ddad822f/install.sh | sh -s -- -b /usr/local/bin -v v0.118.0
          grype db update

      - name: Run unified delivery gate (pre-pr)
        run: pnpm delivery:gate:pr

  mcp-servers:
    name: MCP Servers Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch MCP server self-test
        run: pnpm mcp:fetch:test

  node-compat:
    name: Node Compatibility (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Config validation
        run: pnpm test:config

  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify VERSION/package.json/CHANGELOG alignment
        run: npm run version:check

  profiles-sync:
    name: Tool Profiles Sync Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tool-profiles match profiles.yaml
        run: pnpm profiles:check

  metrics-verify:
    name: Live Metrics Verify (F4.1 — informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify live metrics (config/stack-metrics.json)
        run: pnpm metrics:verify -- --json || pnpm metrics:verify

  static-gates:
    name: Static Deployment and Artifact Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production env and generated-artifact hygiene
        run: pnpm ci:static-gates
      - name: Report image mutability pending release digest binding
        run: pnpm ci:static-gates -- --report
      - name: Report deployment prerequisites and external inputs
        run: pnpm validate:deployment -- --report

  graphify-affected:
    name: Graphify Affected Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build knowledge graph
        run: pnpm graphify -- build
      - name: Analyze affected nodes for changed source files
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '*.ts' '*.tsx' '*.js' '*.jsx')
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            pnpm graphify -- affected "$file" --max 200 --json || true
          done <<< "$changed"

  sre-informational:
    name: SRE Report (Error Budget + Perf SLO — informational, non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Non-gating BY DESIGN: these report live SLO status; promoting them to
      # gates requires agreed thresholds first (see STACK-EVOLUTION-PLAN F1.2)
      - name: Error Budget check
        run: pnpm error-budget --json || true

      - name: Performance SLO check
        run: pnpm perf:slo --ci-gate --json || true

  planning-estimate:
    name: Planning Estimate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate planning estimate
        run: |
          echo "## Planning Estimate" >> $GITHUB_STEP_SUMMARY
          npx tsx src/planning/planning-integration.ts pr-description >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker
    uses: ./.github/workflows/reusable-docker.yml
    permissions:
      contents: read
    if: github.event_name == 'push'

  governance:
    name: Governance
    uses: ./.github/workflows/reusable-governance.yml
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'push'

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SBOM
        run:
          npx tsx src/security/generate-sbom.ts --output sbom/gentle-vanguard-sbom.json --format
          json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-report
          path: sbom/
          retention-days: 90
