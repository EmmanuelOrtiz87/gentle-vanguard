apiVersion: apps/v1
kind: Deployment
metadata:
  name: gentle-vanguard-dashboard
  namespace: gentle-vanguard
  labels:
    app: gentle-vanguard
    component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gentle-vanguard
      component: dashboard
  template:
    metadata:
      labels:
        app: gentle-vanguard
        component: dashboard
    spec:
      containers:
        - name: dashboard
          image: gentle-vanguard/dashboard:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: 'production'
            - name: WS_PORT
              value: '8080'
          volumeMounts:
            - name: session-data
              mountPath: /workspace/.session
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gentle-vanguard-ws
  namespace: gentle-vanguard
  labels:
    app: gentle-vanguard
    component: websocket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gentle-vanguard
      component: websocket
  template:
    metadata:
      labels:
        app: gentle-vanguard
        component: websocket
    spec:
      containers:
        - name: websocket
          image: gentle-vanguard/websocket:latest
          ports:
            - containerPort: 8081
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '8081'
          volumeMounts:
            - name: session-data
              mountPath: /workspace/.session
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gentle-vanguard-mcp
  namespace: gentle-vanguard
  labels:
    app: gentle-vanguard
    component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gentle-vanguard
      component: mcp
  template:
    metadata:
      labels:
        app: gentle-vanguard
        component: mcp
    spec:
      containers:
        - name: mcp
          image: gentle-vanguard/mcp:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: 'production'
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gentle-vanguard-dashboard-svc
  namespace: gentle-vanguard
spec:
  selector:
    app: gentle-vanguard
    component: dashboard
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: gentle-vanguard-ws-svc
  namespace: gentle-vanguard
spec:
  selector:
    app: gentle-vanguard
    component: websocket
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: gentle-vanguard-mcp-svc
  namespace: gentle-vanguard
spec:
  selector:
    app: gentle-vanguard
    component: mcp
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gentle-vanguard-session-pvc
  namespace: gentle-vanguard
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
