<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Routing learning loop</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --paper: #f5f5f5;
        --ink: #2d3142;
        --muted: #4f5d75;
        --soft: #7a8399;
        --accent: #eb6c36;
        --accent-tint: rgba(235, 108, 54, 0.08);
        --link: #2e5aa8;
        --sans: 'Geist', system-ui, sans-serif;
        --serif: 'Instrument Serif', serif;
        --mono: 'Geist Mono', ui-monospace, monospace;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }
      .frame {
        width: 100%;
        max-width: 1200px;
      }
      .eyebrow {
        margin-bottom: 0.5rem;
        color: var(--muted);
        font: 500 0.66rem var(--mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin-bottom: 0.5rem;
        color: var(--ink);
        font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif);
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin-bottom: 1.5rem;
        color: var(--muted);
        font: 400 0.9rem var(--sans);
      }
      svg {
        display: block;
        width: 100%;
        min-width: 900px;
      }
      .ring {
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.2;
      }
      .spoke {
        fill: none;
        stroke: var(--soft);
        stroke-width: 1;
        stroke-dasharray: 5 4;
      }
      .station {
        fill: var(--paper);
        stroke: var(--ink);
        stroke-width: 1;
      }
      .station.focal {
        fill: var(--accent-tint);
        stroke: var(--accent);
        stroke-width: 1.2;
      }
      .hub {
        fill: var(--ink);
      }
      .node-name {
        fill: var(--ink);
        font: 600 12px var(--sans);
        text-anchor: middle;
      }
      .focal-name {
        fill: var(--accent);
      }
      .sublabel {
        fill: var(--soft);
        font: 400 8px var(--mono);
        text-anchor: middle;
      }
      .hub-name {
        fill: var(--paper);
        font: 600 16px var(--sans);
        text-anchor: middle;
      }
      .hub-sub {
        fill: var(--paper);
        opacity: 0.72;
        font: 400 8px var(--mono);
        text-anchor: middle;
      }
      .arrow-label {
        fill: var(--soft);
        font: 400 8px var(--mono);
        letter-spacing: 0.06em;
        text-anchor: middle;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <p class="eyebrow">Loop · Adaptive Routing · Fase 6 N9</p>
      <h1>Routing learning loop</h1>
      <p class="subtitle">
        Cada delegación escribe su resultado en el registro compartido; el router aprende y mejora
        la siguiente recomendación.
      </p>

      <svg
        viewBox="0 0 1040 680"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="routing-learning-loop-title routing-learning-loop-desc"
      >
        <title id="routing-learning-loop-title">Routing learning loop</title>
        <desc id="routing-learning-loop-desc">
          Five stations flow clockwise from Recommend through Delegate, Execute, Record and Rebuild,
          then back to Recommend. Record and Rebuild write durable state into one central
          routing-table hub, with Rebuild highlighted as the learning gate that recomputes success
          rates.
        </desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)" />
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
          </marker>
          <marker
            id="arrow-accent"
            markerWidth="8"
            markerHeight="6"
            refX="7"
            refY="3"
            orient="auto"
          >
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />
          </marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#7a8399" />
          </marker>
        </defs>
        <rect width="1040" height="680" fill="#f5f5f5" />
        <rect width="1040" height="680" fill="url(#dots)" opacity="0.55" />

        <!-- Solid clockwise ring: five arcs on the same r=240 station circle. -->
        <path
          class="ring"
          d="M600 113.726 A240 240 0 0 1 736.300 236.000"
          marker-end="url(#arrow)"
        />
        <path
          class="ring"
          d="M756.640 300.000 A240 240 0 0 1 695.230 504.000"
          marker-end="url(#arrow)"
        />
        <path
          class="ring"
          d="M594.940 568.000 A240 240 0 0 1 445.060 568.000"
          marker-end="url(#arrow)"
        />
        <path
          class="ring"
          d="M344.770 504.000 A240 240 0 0 1 283.360 300.000"
          marker-end="url(#arrow)"
        />
        <path
          class="ring"
          d="M303.700 236.000 A240 240 0 0 1 440.000 113.726"
          marker-end="url(#arrow)"
        />

        <!-- Dashed write-backs: station inner edge to 6px before the hub stroke. -->
        <path class="spoke" d="M520 132 V280" marker-end="url(#arrow-soft)" />
        <path class="spoke" d="M668 292 L624 308" marker-end="url(#arrow-soft)" />
        <path class="spoke" d="M580 424 L560 396" marker-end="url(#arrow-soft)" />
        <path class="spoke" d="M460 424 L480 396" marker-end="url(#arrow-soft)" />
        <path class="spoke" d="M372 292 L416 308" marker-end="url(#arrow-soft)" />

        <!-- Curated spoke labels sit beside the line with an 8px visible gap. -->
        <rect x="388" y="432" width="52" height="16" rx="4" fill="#f5f5f5" />
        <text x="414" y="444" class="arrow-label">OUTCOMES</text>
        <rect x="300" y="316" width="44" height="16" rx="4" fill="#f5f5f5" />
        <text x="322" y="328" class="arrow-label">RATES</text>

        <!-- Stations -->
        <rect class="station" x="440" y="68" width="160" height="64" rx="6" />
        <text x="520" y="96" class="node-name">Recommend</text>
        <text x="520" y="116" class="sublabel">recommend-agent</text>

        <rect class="station" x="668" y="236" width="160" height="64" rx="6" />
        <text x="748" y="264" class="node-name">Delegate</text>
        <text x="748" y="284" class="sublabel">route-and-delegate.ts</text>

        <rect class="station" x="580" y="504" width="160" height="64" rx="6" />
        <text x="660" y="532" class="node-name">Execute</text>
        <text x="660" y="552" class="sublabel">agent runs task</text>

        <rect class="station" x="300" y="504" width="160" height="64" rx="6" />
        <text x="380" y="532" class="node-name">Record</text>
        <text x="380" y="552" class="sublabel">metrics-report.json</text>

        <rect class="station focal" x="212" y="236" width="160" height="64" rx="6" />
        <text x="292" y="264" class="node-name focal-name">Rebuild</text>
        <text x="292" y="284" class="sublabel">adaptive-router --build</text>

        <!-- The one shared-state hub. -->
        <rect class="hub" x="420" y="288" width="200" height="104" rx="8" />
        <text x="520" y="336" class="hub-name">Routing table</text>
        <text x="520" y="360" class="hub-sub">learned routing state</text>
      </svg>
    </main>
  </body>
</html>
