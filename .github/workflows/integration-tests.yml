name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

env:
  NODE_VERSION: '20'

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dashboard server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: gentle-vanguard/dashboard-server:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web dashboard image
        uses: docker/build-push-action@v5
        with:
          context: apps/web-dashboard
          file: apps/web-dashboard/Dockerfile
          tags: gentle-vanguard/web-dashboard:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save images
        run: |
          docker save gentle-vanguard/dashboard-server:test > /tmp/dashboard-server.tar
          docker save gentle-vanguard/web-dashboard:test > /tmp/web-dashboard.tar

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/*.tar
          retention-days: 1

  run-integration:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load images
        run: |
          docker load -i /tmp/dashboard-server.tar
          docker load -i /tmp/web-dashboard.tar

      - name: Start integration environment
        run: |
          docker compose -f docker-compose.test.yml up -d integration-test
        timeout-minutes: 10

      - name: Wait for tests to complete
        run: |
          docker wait gv-integration-test
        timeout-minutes: 15

      - name: Collect test results
        if: always()
        run: |
          docker cp gv-integration-test:/workspace/coverage ./coverage || true
          docker logs gv-integration-test > integration-test-output.log 2>&1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: integration-test-output.log
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes

  test-results:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: run-integration
    if: always()
    steps:
      - name: Report summary
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard Server Build | ${{ needs.build-images.result }}" >> $GITHUB_STEP_SUMMARY
          echo "| Web Dashboard Build | ${{ needs.build-images.result }}" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.run-integration.result }}" >> $GITHUB_STEP_SUMMARY
