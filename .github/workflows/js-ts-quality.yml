name: JS/TS Quality

permissions:
  contents: read

concurrency:
  group: js-ts-quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/**/*.ts'
      - 'src/**/*.ts'
      - 'src/**/*.js'
      - 'package.json'
      - 'tsconfig.json'
      - '.eslintrc.json'
  pull_request:
    branches: [develop, main]
    paths:
      - 'scripts/**/*.ts'
      - 'src/**/*.ts'
      - 'src/**/*.js'
      - 'package.json'
      - 'tsconfig.json'
      - '.eslintrc.json'
  workflow_dispatch:

jobs:
  quality:
    name: ESLint + TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: TypeScript type check
        run: pnpm typecheck
