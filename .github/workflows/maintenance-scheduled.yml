name: Scheduled Maintenance

permissions:
  contents: write

concurrency:
  group: maintenance-scheduled
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0' # 06:00 UTC Sunday | 03:00 GMT-3

jobs:
  watchtower:
    name: Maintenance Watchtower
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Watchtower Health Check
        shell: pwsh
        run: |
          .\scripts\maintenance\maintenance-watchtower.ps1 -Action health
          $exitCode = $LASTEXITCODE
          Write-Host "Watchtower exit code: $exitCode"

      - name: Run Watchtower Rebuild (if stale)
        shell: pwsh
        run: |
          .\scripts\maintenance\maintenance-watchtower.ps1 -Action rebuild
          $exitCode = $LASTEXITCODE
          Write-Host "Rebuild exit code: $exitCode"

      - name: Generate Maintenance Report
        shell: pwsh
        run: |
          .\scripts\maintenance\maintenance-watchtower.ps1 -Action report -OutputFile .runtime/maintenance-report.json
          Get-Content .runtime/maintenance-report.json -Raw | ConvertFrom-Json | ConvertTo-Json

      - name: Upload Maintenance Report
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: .runtime/maintenance-report.json
          retention-days: 30

  fine-tuning:
    name: Fine-Tuning Pipeline
    runs-on: windows-latest
    timeout-minutes: 30
    needs: watchtower
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run FT Pipeline - Collect
        shell: pwsh
        run: |
          .\scripts\utilities\FINE-TUNING\ft-pipeline.ps1 -Stage collect
          Write-Host "FT collect exit code: $LASTEXITCODE"

      - name: Run FT Pipeline - Build Dataset
        shell: pwsh
        run: |
          .\scripts\utilities\FINE-TUNING\ft-pipeline.ps1 -Stage build
          Write-Host "FT build exit code: $LASTEXITCODE"

      - name: Run FT Threshold Detection
        shell: pwsh
        run: |
          .\scripts\utilities\FINE-TUNING\ft-threshold-detect.ps1
          Write-Host "FT threshold exit code: $LASTEXITCODE"

      - name: Run FT Auto-Prune
        shell: pwsh
        run: |
          .\scripts\utilities\FINE-TUNING\ft-auto-prune.ps1 -Days 7
          Write-Host "FT auto-prune exit code: $LASTEXITCODE"

      - name: Upload FT Reports
        uses: actions/upload-artifact@v4
        with:
          name: ft-reports
          path: |
            .ft/benchmarks/
            .ft/dataset/
          retention-days: 30

      - name: Commit Auto-Fixes (if any)
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            git config user.name "gentle-vanguard[bot]"
            git config user.email "bot@gentle-vanguard.dev"
            git add -A
            git commit -m "chore: auto-maintenance rebuild [skip ci]"
            git push
            Write-Host "Auto-fixes committed"
          } else {
            Write-Host "No changes to commit"
          }
