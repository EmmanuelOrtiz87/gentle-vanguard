# lefthook.yml v3.1 — Git hooks for Gentle-Vanguard (PS1→TS)
# All hooks migrated from PowerShell to TypeScript

post-commit:
  commands:
    codegraph-sync:
      run: npx tsx src/codegraph-post-modification-sync.ts --Trigger post-commit --Force
    hashline-snapshot:
      run: npx tsx src/infrastructure/hashline-snapshot-hook.ts

post-merge:
  commands:
    codegraph-sync:
      run: npx tsx src/codegraph-post-modification-sync.ts --Trigger post-merge --Force
    post-merge-install:
      glob: 'package.json'
      run: pnpm install --ignore-scripts

pre-commit:
  commands:
    opencode-validation:
      glob: '*.json'
      run: npx tsx src/hooks/pre-commit-opencode-validation.ts {staged_files}
    json-lint:
      glob: '*.json'
      run: npx tsx src/json-lint.ts {staged_files}
    workflow-lint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: npx tsx src/review/workflow-lint.ts {staged_files}
    lockfile-lint:
      glob: 'package-lock.json'
      run: npx tsx src/infrastructure/lockfile-lint-pre-commit.ts
    # trufflehog removed 2026-08-22: it ran with --fail=false AND `|| exit 0`
    # (never blocked anything). Secret coverage is provided by secretlint +
    # secret-scanner here, and gitleaks in CI.
    skill-scan:
      glob: '{.opencode/,}skills/*/SKILL.md'
      run: npx tsx src/scan-skill-hook.ts --StagedFiles '{staged_files}'
    secretlint:
      glob: '*.{json,yml,yaml,md,env,toml,xml}'
      run: npx secretlint --secretlintrc .secretlintrc.json {staged_files} 2>&1
    secret-scanner:
      glob: '*.{ts,js,json,yml,yaml,md,env,toml,xml,py,ps1,sh,sql}'
      run: npx tsx src/security/secret-scanner-cli.ts --scan {staged_files} --redact

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    lint:
      run: pnpm lint
    audit-check:
      run: npx tsx src/infrastructure/siem-audit-bridge.ts --Scope quick
    orchestrator-auto-fix:
      run: npx tsx src/orchestration/orchestrate-auto-fix.ts --Fix
    npm-audit:
      glob: 'package.json'
      run: npx tsx src/infrastructure/npm-audit-pre-push.ts --AuditLevel moderate
    # Static shell-quoting audit — fails the push when runSyncShell embeds quoted
    # interpolation (cmd /d /s /c strips inner quotes → broken paths / injection).
    shell-quoting:
      run: npm run audit:shell-quoting
    # Perf baseline validation — self-skips (exit 0) when tests/performance/baseline.json
    # is missing or when --skip is passed, per config/alert policy in baseline.json
    perf-baseline:
      run: npm run perf:baseline:check
    # Code coverage gate — quick mode (~5s, core suites only). Informational:
    # quick mode never fails the push (aggregate enforcement is full-mode only).
    # --no-write: validate without touching reports/coverage-summary.json (keeps
    # the working tree clean so the push is not aborted by a dirty tree).
    coverage-gate:
      run: npm run coverage:quick -- --no-write
    # Container/artifact vulnerability gate — scans the SBOM with Syft+Grype
    # (no Docker required). Exit 1 blocks the push when any vuln >= high is found.
    # Self-skips (exit 0) when the toolchain is unavailable (no syft/grype/trivy).
    # The SBOM is regenerated first: sbom.json is gitignored (CI owns the
    # canonical artifact) so the local copy must not go stale.
    container-scan:
      run:
        npx tsx src/security/generate-sbom.ts --output sbom.json --format json && npx tsx
        src/security/container-scan.ts scan --fail-on high --json
    # Content operations validation (~3s) — catches broken content manifests
    # before CI does.
    content-validate:
      run: npm run content:validate
    # CI static gates locally (~35s) — same checks CI runs (deployment
    # prerequisites, image policies) so pushes fail fast instead of in CI.
    ci-static-gates:
      run: npm run ci:static-gates

commit-msg:
  commands:
    commitlint:
      run: npx tsx src/hooks/commitlint.ts {1}
    commit-msg-session-track:
      run: npx tsx src/hooks/commit-msg-session-track-hook.ts --CommitMsgFile {1}
