# lefthook.yml v3.1 — Git hooks for Gentle-Vanguard (PS1→TS)
# All hooks migrated from PowerShell to TypeScript

post-commit:
  commands:
    codegraph-sync:
      run:
        npx tsx src/integrations/codegraph-post-modification-sync.ts --Trigger post-commit --Force
    hashline-snapshot:
      run: npx tsx src/infrastructure/hashline-snapshot-hook.ts

post-merge:
  commands:
    codegraph-sync:
      run: npx tsx src/integrations/codegraph-post-modification-sync.ts --Trigger post-merge --Force
    post-merge-install:
      glob: 'package.json'
      run: pnpm install --ignore-scripts

pre-commit:
  commands:
    opencode-validation:
      glob: '*.json'
      run: npx tsx src/hooks/pre-commit-opencode-validation.ts {staged_files}
    json-lint:
      glob: '*.json'
      run: npx tsx src/tools/json-lint.ts {staged_files}
    workflow-lint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: npx tsx src/review/workflow-lint.ts {staged_files}
    lockfile-lint:
      glob: 'package-lock.json'
      run: npx tsx src/infrastructure/lockfile-lint-pre-commit.ts
    # trufflehog removed 2026-08-22: it ran with --fail=false AND `|| exit 0`
    # (never blocked anything). Secret coverage is provided by secretlint +
    # secret-scanner here, and gitleaks in CI.
    skill-scan:
      glob: '{.opencode/,}skills/*/SKILL.md'
      run: npx tsx src/knowledge/scan-skill-hook.ts --StagedFiles '{staged_files}'
    secretlint:
      glob: '*.{json,yml,yaml,md,env,toml,xml}'
      run: npx secretlint --secretlintrc .secretlintrc.json {staged_files} 2>&1
    secret-scanner:
      glob: '*.{ts,js,json,yml,yaml,md,env,toml,xml,py,ps1,sh,sql}'
      run: npx tsx src/security/secret-scanner-cli.ts --scan {staged_files} --redact
    metrics-check:
      glob: 'config/stack-metrics.json'
      run: npx tsx src/tools/metrics-verify.ts {staged_files}
    design-lint:
      glob: '{apps/*/src/**/*.{css,tsx,jsx},apps/*/style.css,apps/*/*.css,assets/*.css,packages/gv-design-system/src/**/*.{css,tsx}}'
      run: npx impeccable detect --no-config --json --quiet {staged_files} 2>&1 || true
      # The `|| true` makes the hook non-blocking for now; we want findings as advisory.
      # Promote to blocking when the team is ready (set in .impeccable/config.json).
      # See ADR-0026 §"Plan de implementación" Fase 1.

pre-push:
  commands:
    # Composite parallel gate (Fase 6 N8) — replaces the 12 sequential checks.
    # Runs all checks concurrently (bounded pool) with a tree-hash cache: if
    # nothing changed since the last green run, the gate skips in <5s.
    # Force a full re-run with: npx tsx src/git/prepush-gate.ts --force
    prepush-gate:
      run: npx tsx src/git/prepush-gate.ts

commit-msg:
  commands:
    commitlint:
      run: npx tsx src/hooks/commitlint.ts {1}
    commit-msg-session-track:
      run: npx tsx src/hooks/commit-msg-session-track-hook.ts --CommitMsgFile {1}
