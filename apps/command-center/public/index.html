<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gentle-Vanguard — Command Center</title>
    <link rel="stylesheet" href="/gv-design-system.css" />
    <style>
      :root {
        --primary: #00bfff;
        --primary-light: #4dcfff;
        --primary-dark: #0055bb;
        --accent: #a855f7;
        --bg: #0d1117;
        --surface: #1a2035;
        --icon: #2a2d3a;
        --text: #fff;
        --muted: #6b7280;
        --border: #1e3a5f;
        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
        --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
        --mono: 'JetBrains Mono', 'Cascadia Code', monospace;
        --bg-glow: #102b45;
        --card: #121a2aee;
        --description: #aab4c6;
        --notice-text: #fecaca;
        --notice-bg: #3b1418;
        --badge-running-bg: #14532d;
        --badge-running-text: #bbf7d0;
        --badge-stopped-bg: #334155;
        --badge-stopped-text: #cbd5e1;
        --badge-partial-bg: #78350f;
        --badge-partial-text: #fde68a;
        --danger-border: #7f1d1d;
        --shadow-color: #0003;
        --divider: #ffffff12;
        --glass: rgba(26, 32, 53, 0.6);
        --glass-border: rgba(168, 85, 247, 0.18);
        --gradient: linear-gradient(135deg, #a855f7 0%, #00bfff 100%);
        --glow: rgba(0, 191, 255, 0.35);
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #fff;
        --icon: #f1f5f9;
        --text: #0f172a;
        --muted: #475569;
        --border: #cbd5e1;
        --bg-glow: #dbeafe;
        --card: #ffffffee;
        --description: #475569;
        --notice-text: #b91c1c;
        --notice-bg: #fee2e2;
        --badge-running-bg: #dcfce7;
        --badge-running-text: #166534;
        --badge-stopped-bg: #e2e8f0;
        --badge-stopped-text: #334155;
        --badge-partial-bg: #fef3c7;
        --badge-partial-text: #92400e;
        --danger-border: #b91c1c;
        --shadow-color: #0002;
        --divider: #0f172a12;
        --glass: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(15, 23, 42, 0.1);
        --glow: rgba(8, 145, 178, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
      }
      .gv-grid-bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(168, 85, 247, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 191, 255, 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .gv-glow-a,
      .gv-glow-b {
        position: fixed;
        z-index: -1;
        border-radius: 50%;
        pointer-events: none;
      }
      .gv-glow-a {
        width: 720px;
        height: 720px;
        top: -340px;
        right: -220px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.16), transparent 65%);
      }
      .gv-glow-b {
        width: 640px;
        height: 640px;
        bottom: -320px;
        left: -200px;
        background: radial-gradient(circle, rgba(0, 191, 255, 0.13), transparent 65%);
      }
      .gv-icon-btn {
        font-size: 16px;
        line-height: 1;
      }
      .gv-icon-btn svg {
        display: block;
        width: 16px;
        height: 16px;
      }
      main {
        max-width: 1180px;
        margin: auto;
        padding: 38px 24px 48px;
      }
      #start-all,
      #stop-all {
        padding: 8px;
        border: 0;
        color: var(--muted);
        background: var(--icon);
      }
      #start-all:hover:not(:disabled),
      #stop-all:hover:not(:disabled) {
        color: var(--text);
        background: var(--border);
      }
      .refresh {
        padding: 8px;
        border: 0;
        background: var(--icon);
      }
      .section-heading {
        margin-bottom: 20px;
      }
      .gv-topbar + .section-heading {
        margin-top: 32px;
      }
      .section-title {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .section-sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 0 0 22px;
      }
      .hstat {
        min-width: 150px;
        padding: 13px 16px;
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        background: var(--glass);
      }
      .hstat strong {
        display: block;
        color: var(--primary);
        font: 800 20px var(--mono);
      }
      .hstat span {
        color: var(--muted);
        font-size: 11px;
      }
      h1 {
        margin: 0;
        color: var(--primary);
        font-size: clamp(25px, 4vw, 42px);
        letter-spacing: -0.03em;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: var(--text);
        border: none;
        background: transparent;
        border-radius: 999px;
        padding: 13px 26px;
        font-weight: 700;
        font-size: 15.5px;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 8px 30px var(--glow);
      }
      button:focus-visible {
        outline: 3px solid var(--primary-light);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      .refresh {
        white-space: nowrap;
      }
      .header-actions select,
      #theme {
        border: 1.5px solid color-mix(in srgb, var(--primary) 50%, transparent);
        color: var(--text);
        background: none;
      }
      #start-all,
      .power {
        color: var(--bg);
        background: var(--gradient);
      }
      #stop-all,
      .open,
      .refresh {
        color: var(--text);
        border: 1.5px solid color-mix(in srgb, var(--primary) 50%, transparent);
        background: none;
      }
      .presets {
        display: flex;
        gap: 9px;
        margin: -12px 0 20px;
      }
      .cc-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .preset-stop {
        border-color: var(--danger-border);
      }
      .notice {
        padding: 12px 15px;
        border: 1px solid var(--error);
        color: var(--notice-text);
        background: var(--notice-bg);
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }
      .card {
        background: var(--glass);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        padding: 22px 24px;
        transition: all 0.18s;
      }
      .card:hover {
        transform: translateY(-3px);
        border-color: color-mix(in srgb, var(--primary) 45%, transparent);
        box-shadow: 0 14px 40px rgba(13, 17, 23, 0.5);
      }
      .view-fade {
        animation: viewIn 0.28s ease both;
      }
      @keyframes viewIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .card h2 {
        margin: 0 0 7px;
        font-size: 21px;
      }
      .description {
        margin: 0;
        color: var(--description);
        font-size: 14px;
        line-height: 1.5;
      }
      .badge {
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 700;
        height: max-content;
        text-transform: uppercase;
      }
      .running {
        color: var(--badge-running-text);
        background: var(--badge-running-bg);
      }
      .stopped {
        color: var(--badge-stopped-text);
        background: var(--badge-stopped-bg);
      }
      .partial {
        color: var(--badge-partial-text);
        background: var(--badge-partial-bg);
      }
      .processes {
        margin: 22px 0 18px;
        padding-top: 14px;
        border-top: 1px solid var(--divider);
        font: 12px var(--mono);
        color: var(--description);
      }
      .process {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 0;
      }
      .up {
        color: var(--success);
      }
      .down {
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 9px;
      }
      .power {
        color: var(--bg);
        background: var(--gradient);
      }
      .open {
        flex: 1;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 40px;
      }
      .meta {
        font: 11px var(--mono);
        color: var(--muted);
        margin-top: 28px;
        text-align: right;
      }
      .gv-footer {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 24px;
        border-top: 1px solid var(--glass-border);
        color: var(--muted);
        text-align: center;
        font: 12px var(--mono);
      }
      .gv-footer strong {
        color: var(--primary);
        font-family: 'Orbitron', var(--font);
      }
      @media (max-width: 600px) {
        main {
          padding: 28px 15px;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        .refresh {
          width: 100%;
        }
        .process {
          flex-direction: column;
          gap: 2px;
        }
        .actions {
          flex-wrap: wrap;
        }
        .actions button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="gv-grid-bg"></div>
      <div class="gv-glow-a"></div>
      <div class="gv-glow-b"></div>
      <header class="gv-topbar">
        <div class="gv-topbar-inner">
          <div class="gv-brand">
            <img src="/logo.svg" alt="Gentle-Vanguard" class="gv-brand-logo" />
            <span class="gv-wordmark"
              >Gentle<span>Vanguard</span> <small data-i18n="appName"></small
            ></span>
          </div>
          <div class="gv-system-state ready">
            <span id="running-state">0</span> <span data-i18n="runningApps"></span>
          </div>
          <div class="cc-actions">
            <button
              id="start-all"
              class="gv-icon-btn"
              title="Arrancar todo"
              aria-label="Arrancar todo"
              onclick="preset('start-all')"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 2v10" />
                <path d="M18.4 6.6a9 9 0 1 1-12.8 0" />
              </svg>
            </button>
            <button
              id="stop-all"
              class="gv-icon-btn preset-stop"
              title="Detener todo"
              aria-label="Detener todo"
              onclick="preset('stop-all')"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect width="18" height="18" x="3" y="3" rx="2" />
              </svg>
            </button>
            <div class="gv-lang-dropdown">
              <button
                id="language-toggle"
                class="gv-icon-btn"
                type="button"
                aria-label="Idioma"
                title="Idioma"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="m5 8 6 6" />
                  <path d="m4 14 6-6 2-3" />
                  <path d="M2 5h12" />
                  <path d="M7 2h1" />
                  <path d="m22 22-5-10-5 10" />
                  <path d="M14 18h6" />
                </svg>
              </button>
              <div id="language-menu" class="gv-lang-dropdown-menu" hidden>
                <button type="button" data-lang="es">
                  <span>🇪🇸</span><span>Español</span><span class="gv-lang-check"></span>
                </button>
                <button type="button" data-lang="en">
                  <span>🇬🇧</span><span>English</span><span class="gv-lang-check"></span>
                </button>
              </div>
            </div>
            <button
              id="theme"
              class="gv-icon-btn"
              type="button"
              aria-label="Cambiar tema"
              title="Cambiar tema"
            >
              <svg
                class="theme-sun"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
              <svg
                class="theme-moon"
                hidden
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 3a6.5 6.5 0 1 0 9 9 9 9 0 1 1-9-9Z" />
              </svg>
            </button>
            <button
              class="gv-icon-btn refresh"
              id="refresh"
              aria-label="Actualizar aplicaciones"
              title="Actualizar aplicaciones"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 12a9 9 0 0 1 15.3-6.4L21 8" />
                <path d="M21 3v5h-5" />
                <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16" />
                <path d="M3 21v-5h5" />
              </svg>
            </button>
          </div>
        </div>
      </header>
      <div class="section-heading">
        <h1 class="section-title" data-i18n="appsTitle"></h1>
        <p class="section-sub" data-i18n="appsSubtitle"></p>
      </div>
      <div class="stats" aria-label="Stack status">
        <div class="hstat">
          <strong id="running-count">0</strong><span data-i18n="runningApps"></span>
        </div>
        <div class="hstat">
          <strong id="stopped-count">0</strong><span data-i18n="stoppedApps"></span>
        </div>
        <div class="hstat"><strong>5s</strong><span data-i18n="polling"></span></div>
      </div>
      <div id="error" class="notice" role="alert" hidden></div>
      <section id="apps" class="grid view-fade" aria-live="polite">
        <div class="empty" data-i18n="loading"></div>
      </section>
      <footer class="gv-footer">
        <strong>Gentle-Vanguard</strong> · <span data-i18n="footerTagline"></span> — v3.8.2 · 2026
      </footer>
    </main>
    <script>
      // Surface ANY unexpected error in the UI — a silent failure here would
      // leave the grid stuck at "Cargando aplicaciones…" with no visible cause.
      window.onerror = function (msg, src, line) {
        try {
          show(String(msg) + ' (' + String(src).split('/').pop() + ':' + line + ')');
        } catch {}
        return false;
      };
      window.addEventListener('unhandledrejection', function (ev) {
        show(ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason));
      });
      const I18N = {
        es: {
          title: 'Gentle-Vanguard — Command Center',
          appName: 'Command Center',
          appsTitle: 'Aplicaciones del stack',
          appsSubtitle: 'Controla el ciclo de vida de cada aplicación desde un solo lugar.',
          runningApps: 'en ejecución',
          stoppedApps: 'detenidas',
          polling: 'actualización automática',
          footerTagline: 'Control de ciclo de vida de apps',
          subtitle: 'Inicia, detén y abre las aplicaciones del stack bajo demanda.',
          refresh: '↻ Actualizar',
          startAll: '⏻ Arrancar todo',
          stopAll: '⏹ Detener todo',
          loading: 'Cargando aplicaciones…',
          empty: 'No hay aplicaciones registradas.',
          meta: 'Actualización automática cada 5 segundos · solo loopback',
          running: 'En ejecución',
          stopped: 'Detenida',
          partial: 'Parcial',
          stopConfirm: '¿Detener esta aplicación?',
          stopMany: '¿Detener {n} aplicaciones en ejecución?',
          start: 'Iniciar',
          stop: 'Detener',
          open: 'Abrir',
          error: 'No se pudieron cargar las aplicaciones: ',
          theme: 'Cambiar tema',
        },
        en: {
          title: 'Gentle-Vanguard — Command Center',
          appName: 'Command Center',
          appsTitle: 'Stack applications',
          appsSubtitle: 'Control the lifecycle of every application from one place.',
          runningApps: 'running',
          stoppedApps: 'stopped',
          polling: 'automatic refresh',
          footerTagline: 'App lifecycle control',
          subtitle: 'Start, stop, and open stack applications on demand.',
          refresh: '↻ Refresh',
          startAll: '⏻ Start all',
          stopAll: '⏹ Stop all',
          loading: 'Loading applications…',
          empty: 'No applications registered.',
          meta: 'Automatic refresh every 5 seconds · loopback only',
          running: 'Running',
          stopped: 'Stopped',
          partial: 'Partial',
          stopConfirm: 'Stop this application?',
          stopMany: 'Stop {n} running applications?',
          start: 'Start',
          stop: 'Stop',
          open: 'Open',
          error: 'Could not load applications: ',
          theme: 'Change theme',
        },
      };
      let lang = localStorage.getItem('gv-cc-lang') === 'en' ? 'en' : 'es';
      let theme = localStorage.getItem('gv-cc-theme') === 'light' ? 'light' : 'dark';
      const t = (key) => I18N[lang][key] || I18N.es[key] || key;
      function applyPreferences() {
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach((node) => {
          node.textContent = t(node.dataset.i18n);
        });
        document.querySelectorAll('[data-lang]').forEach((button) => {
          const active = button.dataset.lang === lang;
          button.setAttribute('aria-current', active ? 'true' : 'false');
          button.querySelector('.gv-lang-check').textContent = active ? '✓' : '';
        });
        const themeButton = document.querySelector('#theme');
        themeButton.querySelector('.theme-sun').hidden = theme !== 'dark';
        themeButton.querySelector('.theme-moon').hidden = theme === 'dark';
        themeButton.setAttribute('aria-label', t('theme'));
        themeButton.setAttribute('title', t('theme'));
        document
          .querySelector('#language-toggle')
          .setAttribute('aria-label', lang === 'es' ? 'Idioma' : 'Language');
        document
          .querySelector('#language-toggle')
          .setAttribute('title', lang === 'es' ? 'Idioma' : 'Language');
        document.querySelector('#start-all').setAttribute('aria-label', t('startAll'));
        document.querySelector('#start-all').setAttribute('title', t('startAll'));
        document.querySelector('#stop-all').setAttribute('aria-label', t('stopAll'));
        document.querySelector('#stop-all').setAttribute('title', t('stopAll'));
        document.querySelector('#refresh').setAttribute('aria-label', t('refresh'));
        document.querySelector('#refresh').setAttribute('title', t('refresh'));
      }
      const labels = {
        running: () => t('running'),
        stopped: () => t('stopped'),
        partial: () => t('partial'),
      };
      let busy = '';
      let presetBusy = false;
      let lastSnapshot = '';
      const cardNodes = new Map();
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      async function load() {
        try {
          const r = await fetch('/api/apps');
          if (!r.ok) throw Error('HTTP ' + r.status);
          render(await r.json());
          document.querySelector('#error').hidden = true;
        } catch (e) {
          show(e.message);
        }
      }
      function show(message) {
        const e = document.querySelector('#error');
        e.textContent = t('error') + message;
        e.hidden = false;
      }
      function render(apps) {
        const snapshot = JSON.stringify(apps);
        if (snapshot === lastSnapshot) return;
        lastSnapshot = snapshot;
        window.currentApps = apps;
        const running = apps.filter((app) => app.status === 'running').length;
        document.querySelector('#running-state').textContent = running;
        document.querySelector('#running-count').textContent = running;
        document.querySelector('#stopped-count').textContent = apps.length - running;
        const grid = document.querySelector('#apps');
        const seen = new Set();
        apps.forEach((app) => {
          seen.add(app.id);
          let card = cardNodes.get(app.id);
          if (!card) {
            card = createCard(app);
            cardNodes.set(app.id, card);
            grid.append(card.node);
          }
          updateCard(card, app);
        });
        cardNodes.forEach((card, id) => {
          if (!seen.has(id)) {
            card.node.remove();
            cardNodes.delete(id);
          }
        });
        const empty = grid.querySelector('.empty');
        if (apps.length === 0 && !empty) {
          const node = document.createElement('div');
          node.className = 'empty';
          node.textContent = t('empty');
          grid.append(node);
        } else if (apps.length > 0 && empty) {
          empty.remove();
        }
      }
      function createCard(app) {
        const node = document.createElement('article');
        node.className = 'card';
        const top = document.createElement('div');
        top.className = 'card-top';
        const copy = document.createElement('div');
        const title = document.createElement('h2');
        const description = document.createElement('p');
        description.className = 'description';
        copy.append(title, description);
        const badge = document.createElement('span');
        badge.className = 'badge';
        top.append(copy, badge);
        const processes = document.createElement('div');
        processes.className = 'processes';
        const actions = document.createElement('div');
        actions.className = 'actions';
        const power = document.createElement('button');
        power.className = 'power';
        const open = document.createElement('button');
        open.className = 'open';
        actions.append(power, open);
        node.append(top, processes, actions);
        return { node, title, description, badge, processes, power, open, processNodes: new Map() };
      }
      function updateCard(card, app) {
        card.title.textContent = app.name;
        card.description.textContent = app.description;
        card.badge.className = 'badge ' + app.status;
        card.badge.textContent = labels[app.status]();
        const seen = new Set();
        app.processes.forEach((process) => {
          seen.add(process.name);
          let line = card.processNodes.get(process.name);
          if (!line) {
            line = { node: document.createElement('div'), value: document.createElement('span') };
            line.node.className = 'process';
            const name = document.createElement('span');
            name.textContent = process.name;
            line.node.append(name, line.value);
            card.processNodes.set(process.name, line);
            card.processes.append(line.node);
          }
          line.value.className = process.alive ? 'up' : 'down';
          line.value.textContent = process.alive
            ? 'PID ' + (process.pid || '—') + ' · Port ' + process.port
            : 'Port ' + process.port + ' · Offline';
        });
        card.processNodes.forEach((line, name) => {
          if (!seen.has(name)) {
            line.node.remove();
            card.processNodes.delete(name);
          }
        });
        const action = app.status === 'running' ? t('stop') : t('start');
        card.power.disabled = Boolean(busy || presetBusy);
        card.power.textContent = '⏻ ' + action;
        card.power.setAttribute('aria-label', action + ' ' + app.name);
        card.power.onclick = () => void toggle(app.id, app.status);
        card.open.textContent = '↗ ' + t('open');
        card.open.setAttribute('aria-label', t('open') + ' ' + app.name);
        card.open.onclick = () => window.open(app.url, '_blank', 'noopener,noreferrer');
      }
      async function toggle(id, status) {
        if (status === 'running' && !confirm(t('stopConfirm'))) return;
        busy = id;
        try {
          const r = await fetch(
            '/api/apps/' + encodeURIComponent(id) + '/' + (status === 'running' ? 'stop' : 'start'),
            { method: 'POST' },
          );
          if (!r.ok) throw Error('HTTP ' + r.status);
          await load();
        } catch (e) {
          show(e.message);
        } finally {
          busy = '';
          await load();
        }
      }
      async function preset(name) {
        if (name === 'stop-all') {
          const apps = await fetch('/api/apps')
            .then((r) => r.json())
            .catch(() => []);
          const running = apps.filter((app) => app.status === 'running').length;
          if (!confirm(t('stopMany').replace('{n}', running))) return;
        }
        presetBusy = true;
        document.querySelector('#start-all').disabled = true;
        document.querySelector('#stop-all').disabled = true;
        render(window.currentApps || []);
        try {
          const r = await fetch('/api/presets/' + name, { method: 'POST' });
          if (!r.ok) throw Error('HTTP ' + r.status);
          await load();
        } catch (e) {
          show(e.message);
        } finally {
          presetBusy = false;
          document.querySelector('#start-all').disabled = false;
          document.querySelector('#stop-all').disabled = false;
          await load();
        }
      }
      // Bootstrap: initial load + 5s polling (matches the footer promise).
      // Without this the script only defines functions and the grid stays at
      // "Cargando aplicaciones…" forever — no error, no render.
      document.querySelector('#language-toggle').addEventListener('click', () => {
        const menu = document.querySelector('#language-menu');
        menu.hidden = !menu.hidden;
      });
      document.querySelectorAll('[data-lang]').forEach((button) => {
        button.addEventListener('click', () => {
          lang = button.dataset.lang;
          localStorage.setItem('gv-cc-lang', lang);
          applyPreferences();
          document.querySelector('#language-menu').hidden = true;
          void load();
        });
      });
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.gv-lang-dropdown'))
          document.querySelector('#language-menu').hidden = true;
      });
      document.querySelector('#theme').addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('gv-cc-theme', theme);
        applyPreferences();
      });
      document.querySelector('#refresh').addEventListener('click', () => void load());
      applyPreferences();
      void load();
      setInterval(() => void load(), 5000);
    </script>
  </body>
</html>
