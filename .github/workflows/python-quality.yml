name: Python Quality

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
  pull_request:
    branches: [develop, main]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff Lint + Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      - name: Check lint
        run: ruff check --output-format=github .
      - name: Check format
        run: ruff format --check .

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          find . -name 'requirements.txt' -exec pip install -r {} \;
      - name: Run tests
        run: |
          pytest --ignore=.tmp --ignore=node_modules -v --tb=short || echo "No Python tests found or tests failed — non-blocking"
