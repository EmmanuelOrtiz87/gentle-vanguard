name: Activation Approval Recorder

on:
  pull_request:
    types: [labeled, unlabeled, closed]
    branches: [develop]

jobs:
  record-activation:
    name: Record activation when approved
    runs-on: ubuntu-latest
    if: |
      github.event.label.name == 'experimental-activation' || github.event.action == 'closed'
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Check approvals
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const pr = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number});
            const reviews = await github.rest.pulls.listReviews({owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.data.number});
            const approvals = reviews.data.filter(r => r.state==='APPROVED');
            if(approvals.length < 1 && context.payload.action !== 'closed'){
              core.setFailed('Activation PR requires at least one approval.');
              return;
            }
            // Keep the audit record in the workflow summary instead of creating
            // an issue with a write-scoped token for every labeled PR.
            await core.summary
              .addHeading('Activation record')
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['PR', `#${pr.data.number}`],
                ['Title', pr.data.title],
                ['Approvals', String(approvals.length)],
                ['URL', pr.data.html_url],
              ])
              .write();
