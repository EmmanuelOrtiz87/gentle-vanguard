name: Reusable Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  js-ts:
    name: JS/TS Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: npm run audit:shell-quoting
      - run: pnpm test:config

  ts-gates:
    name: TypeScript Script Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:smoke
      - run: pnpm test:scripts-smoke

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: |
            **/*.md
            !.archive/**/*.md
            !.backups/**/*.md
            !.session/**/*.md
            !.sdd/**/*.md
            !build/**/*.md
            !node_modules/**/*.md
            !**/node_modules/**/*.md
            !.runtime/**/*.md
            !.opencode/**/*.md
            !.windsurf/**/*.md
            !skills/**/*.md
            !public/skills/**/*.md
            !knowledge-base/**/*.md
            !reports/**/*.md
            !research/**/*.md
            !demos/**/*.md
            !adapters/**/*.md
            !graphify-out/**/*.md
            !.logs/**/*.md
          config: .markdownlint.json

  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  commit:
    name: Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dependabot commits use its own format (chore(deps)(deps): ...) that is not
    # conventional-commits compliant — linting them blocks every deps PR.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run:
          npx commitlint --config config/commitlint.config.cjs --from ${{
          github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate workflows (gate)
        run: npx tsx src/review/workflow-lint.ts .github/workflows
      - name: Validate npm ci compliance
        run: npx tsx src/infrastructure/npm-ci-check.ts

  openapi:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate OpenAPI specs
        shell: pwsh
        run: |
          $specs = Get-ChildItem -Path templates/api -Filter "openapi*" | ForEach-Object { $_.FullName }
          if (-not $specs) { echo "No OpenAPI specs found"; exit 0 }
          npx @redocly/cli lint $specs
