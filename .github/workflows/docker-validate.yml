name: Docker Build Validation

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/web-dashboard/Dockerfile'
      - 'docker-compose*.yml'
      - 'apps/web-dashboard/**'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/web-dashboard/Dockerfile'
      - 'docker-compose*.yml'
      - 'apps/web-dashboard/**'

permissions:
  contents: read
  checks: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - path: Dockerfile
            tag: dashboard-server
          - path: apps/web-dashboard/Dockerfile
            tag: web-dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.tag }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path == 'Dockerfile' && '.' || 'apps/web-dashboard' }}
          file: ${{ matrix.path }}
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image for security scan
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }} > /tmp/${{ matrix.tag }}.tar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.tag }}
          path: /tmp/${{ matrix.tag }}.tar
          retention-days: 1

  compose-test:
    name: Test docker-compose Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Start test services
        run:
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from
          lint-test
        timeout-minutes: 15

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          pattern: docker-image-*
          merge-multiple: true

      - name: Load images
        run: |
          for f in *.tar; do
            docker load -i "$f"
          done

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:dashboard-server-${{ github.sha }}
          format: sarif
          output: trivy-dashboard-server.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Run Trivy on web-dashboard
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:web-dashboard-${{ github.sha }}
          format: sarif
          output: trivy-web-dashboard.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .
          category: trivy

  report:
    name: Build Status Report
    runs-on: ubuntu-latest
    needs: [build, compose-test, security-scan]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "## Docker Build Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "| Compose Test | ${{ needs.compose-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
