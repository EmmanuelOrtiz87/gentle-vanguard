name: TS Dashboard CI

permissions:
  contents: read

concurrency:
  group: dashboard-ts-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web-dashboard/**'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web-dashboard/**'
      - 'pnpm-lock.yaml'

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  quality:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint dashboard
        run: pnpm --filter @gentle-vanguard/web-dashboard lint

      - name: Build dashboard
        run: pnpm --filter @gentle-vanguard/web-dashboard build

  validate:
    name: Validate WebSocket server
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check server
        run: pnpm --filter @gentle-vanguard/web-dashboard exec tsc --noEmit --project tsconfig.json
