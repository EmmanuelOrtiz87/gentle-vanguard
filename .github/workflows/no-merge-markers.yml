name: Prevent Merge Markers

on: [pull_request, push]

jobs:
  check_merge_markers:
    name: Check for merge/conflict markers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e54
      - name: Search for conflict markers
        run: |
          set -e
          echo "Searching for conflict markers (<<<<<<<, =======, >>>>>>>)..."
          if git grep -n "^<<<<<<< "; then
            echo "Found conflict start marker '<<<<<<<'"
            git grep -n "^<<<<<<< " || true
            exit 1
          fi
          if git grep -n "^======="$; then
            echo "Found conflict middle marker '======='"
            git grep -n "^=======" || true
            exit 1
          fi
          if git grep -n "^>>>>>>> "; then
            echo "Found conflict end marker '>>>>>>>'"
            git grep -n "^>>>>>>> " || true
            exit 1
          fi
          echo "No conflict markers found."
