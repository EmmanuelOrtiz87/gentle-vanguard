name: Push Checks

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    uses: ./.github/workflows/reusable-governance.yml
    secrets: inherit
