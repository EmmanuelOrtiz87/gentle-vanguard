name: Experimental Activation Guard

on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]

jobs:
  experimental-guard:
    name: Reject experimental activation without checklist
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.labels.*.name, 'experimental-activation')

    steps:
      - name: Check PR body for activation checklist
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if(!pr){ core.setFailed('No pull_request in payload'); return; }
            const body = pr.body || '';
            const patterns = [
              /- \[x\].*Confirmed module labeled `experimental`/i,
              /- \[x\].*Ran `pnpm test:config` and `pnpm typecheck`/i,
              /- \[x\].*Ran security scan \(e\.g\. `pnpm secretlint`\)/i
            ];
            const missing = patterns.filter(p => !p.test(body));
            if(missing.length){
              core.setFailed('Experimental activation checklist incomplete. Ensure the first three activation items are checked in the PR body.');
            } else {
              console.log('Activation checklist present.');
            }
