<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gentle-Vanguard — Command Center</title>
    <style>
      :root {
        --primary: #00bfff;
        --primary-light: #4dcfff;
        --primary-dark: #0055bb;
        --accent: #a855f7;
        --bg: #0d1117;
        --surface: #1a2035;
        --icon: #2a2d3a;
        --text: #fff;
        --muted: #6b7280;
        --border: #1e3a5f;
        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
        --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
        --mono: 'JetBrains Mono', 'Cascadia Code', monospace;
        --bg-glow: #102b45;
        --card: #121a2aee;
        --description: #aab4c6;
        --notice-text: #fecaca;
        --notice-bg: #3b1418;
        --badge-running-bg: #14532d;
        --badge-running-text: #bbf7d0;
        --badge-stopped-bg: #334155;
        --badge-stopped-text: #cbd5e1;
        --badge-partial-bg: #78350f;
        --badge-partial-text: #fde68a;
        --danger-border: #7f1d1d;
        --shadow-color: #0003;
        --divider: #ffffff12;
        --glass: rgba(26, 32, 53, 0.6);
        --glass-border: rgba(168, 85, 247, 0.18);
        --gradient: linear-gradient(135deg, #a855f7 0%, #00bfff 100%);
        --glow: rgba(0, 191, 255, 0.35);
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #fff;
        --icon: #f1f5f9;
        --text: #0f172a;
        --muted: #475569;
        --border: #cbd5e1;
        --bg-glow: #dbeafe;
        --card: #ffffffee;
        --description: #475569;
        --notice-text: #b91c1c;
        --notice-bg: #fee2e2;
        --badge-running-bg: #dcfce7;
        --badge-running-text: #166534;
        --badge-stopped-bg: #e2e8f0;
        --badge-stopped-text: #334155;
        --badge-partial-bg: #fef3c7;
        --badge-partial-text: #92400e;
        --danger-border: #b91c1c;
        --shadow-color: #0002;
        --divider: #0f172a12;
        --glass: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(15, 23, 42, 0.1);
        --glow: rgba(8, 145, 178, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
      }
      .gv-grid-bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(168, 85, 247, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 191, 255, 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .gv-glow-a,
      .gv-glow-b {
        position: fixed;
        z-index: -1;
        border-radius: 50%;
        pointer-events: none;
      }
      .gv-glow-a {
        width: 720px;
        height: 720px;
        top: -340px;
        right: -220px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.16), transparent 65%);
      }
      .gv-glow-b {
        width: 640px;
        height: 640px;
        bottom: -320px;
        left: -200px;
        background: radial-gradient(circle, rgba(0, 191, 255, 0.13), transparent 65%);
      }
      main {
        max-width: 1180px;
        margin: auto;
        padding: 38px 24px 48px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 30px;
      }
      .gv-topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        margin: 0 -24px 32px;
        padding: 0 24px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--glass-border);
      }
      .topbar-inner {
        max-width: 1180px;
        min-height: 62px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        color: var(--text);
        font:
          800 18px 'Orbitron',
          var(--font);
        white-space: nowrap;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--primary);
        color: var(--primary);
        font: 800 11px var(--font);
      }
      .brand small {
        display: block;
        color: var(--muted);
        font: 600 11px var(--font);
      }
      .system-state {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1.5px solid color-mix(in srgb, var(--primary) 50%, transparent);
        border-radius: 999px;
        color: var(--primary);
        font: 700 12px var(--mono);
        white-space: nowrap;
      }
      .system-state::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 8px currentColor;
        content: '';
      }
      .header-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .gv-icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 8px;
        border: 0;
        border-radius: 9px;
        color: var(--muted);
        background: var(--icon);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .gv-icon-btn:hover:not(:disabled) {
        color: var(--text);
        background: var(--border);
      }
      .gv-icon-btn:focus-visible,
      .gv-lang-dropdown-menu button:focus-visible {
        outline: 3px solid var(--primary-light);
        outline-offset: 2px;
      }
      .gv-lang-dropdown {
        position: relative;
      }
      .gv-lang-dropdown-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 60;
        min-width: 168px;
        padding: 4px;
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: 0 12px 30px #0007;
      }
      .gv-lang-dropdown-menu button {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 8px;
        padding: 9px 10px;
        border: 0;
        border-radius: 7px;
        color: var(--text);
        background: transparent;
        font: 600 13px var(--font);
        text-align: left;
        cursor: pointer;
      }
      .gv-lang-dropdown-menu button:hover,
      .gv-lang-dropdown-menu button[aria-current='true'] {
        background: #00bfff1f;
      }
      .gv-lang-check {
        margin-left: auto;
        color: var(--primary);
      }
      #start-all,
      #stop-all {
        padding: 8px;
        border: 0;
        color: var(--muted);
        background: var(--icon);
      }
      #start-all:hover:not(:disabled),
      #stop-all:hover:not(:disabled) {
        color: var(--text);
        background: var(--border);
      }
      .refresh {
        padding: 8px;
        border: 0;
        background: var(--icon);
      }
      .section-heading {
        margin-bottom: 20px;
      }
      .section-title {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .section-sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 0 0 22px;
      }
      .hstat {
        min-width: 150px;
        padding: 13px 16px;
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        background: var(--glass);
      }
      .hstat strong {
        display: block;
        color: var(--primary);
        font: 800 20px var(--mono);
      }
      .hstat span {
        color: var(--muted);
        font-size: 11px;
      }
      h1 {
        margin: 0;
        color: var(--primary);
        font-size: clamp(25px, 4vw, 42px);
        letter-spacing: -0.03em;
      }
      header p {
        margin: 8px 0 0;
        color: var(--muted);
      }
      button {
        font: inherit;
        cursor: pointer;
        color: var(--text);
        border: none;
        background: transparent;
        border-radius: 999px;
        padding: 13px 26px;
        font-weight: 700;
        font-size: 15.5px;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 8px 30px var(--glow);
      }
      button:focus-visible {
        outline: 3px solid var(--primary-light);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      .refresh {
        white-space: nowrap;
      }
      .header-actions select,
      #theme {
        border: 1.5px solid color-mix(in srgb, var(--primary) 50%, transparent);
        color: var(--text);
        background: none;
      }
      #start-all,
      .power {
        color: var(--bg);
        background: var(--gradient);
      }
      #stop-all,
      .open,
      .refresh {
        color: var(--text);
        border: 1.5px solid color-mix(in srgb, var(--primary) 50%, transparent);
        background: none;
      }
      .presets {
        display: flex;
        gap: 9px;
        margin: -12px 0 20px;
      }
      .preset-stop {
        border-color: var(--danger-border);
      }
      .notice {
        padding: 12px 15px;
        border: 1px solid var(--error);
        color: var(--notice-text);
        background: var(--notice-bg);
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }
      .card {
        background: var(--glass);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        padding: 22px 24px;
        transition: all 0.18s;
      }
      .card:hover {
        transform: translateY(-3px);
        border-color: color-mix(in srgb, var(--primary) 45%, transparent);
        box-shadow: 0 14px 40px rgba(13, 17, 23, 0.5);
      }
      .view-fade {
        animation: viewIn 0.28s ease both;
      }
      @keyframes viewIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .card h2 {
        margin: 0 0 7px;
        font-size: 21px;
      }
      .description {
        margin: 0;
        color: var(--description);
        font-size: 14px;
        line-height: 1.5;
      }
      .badge {
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 700;
        height: max-content;
        text-transform: uppercase;
      }
      .running {
        color: var(--badge-running-text);
        background: var(--badge-running-bg);
      }
      .stopped {
        color: var(--badge-stopped-text);
        background: var(--badge-stopped-bg);
      }
      .partial {
        color: var(--badge-partial-text);
        background: var(--badge-partial-bg);
      }
      .processes {
        margin: 22px 0 18px;
        padding-top: 14px;
        border-top: 1px solid var(--divider);
        font: 12px var(--mono);
        color: var(--description);
      }
      .process {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 0;
      }
      .up {
        color: var(--success);
      }
      .down {
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 9px;
      }
      .power {
        color: var(--bg);
        background: var(--gradient);
      }
      .open {
        flex: 1;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 40px;
      }
      .meta {
        font: 11px var(--mono);
        color: var(--muted);
        margin-top: 28px;
        text-align: right;
      }
      .gv-footer {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 24px;
        border-top: 1px solid var(--glass-border);
        color: var(--muted);
        text-align: center;
        font: 12px var(--mono);
      }
      .gv-footer strong {
        color: var(--primary);
        font-family: 'Orbitron', var(--font);
      }
      @media (max-width: 600px) {
        main {
          padding: 28px 15px;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        .refresh {
          width: 100%;
        }
        .process {
          flex-direction: column;
          gap: 2px;
        }
        .actions {
          flex-wrap: wrap;
        }
        .actions button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="gv-grid-bg"></div>
      <div class="gv-glow-a"></div>
      <div class="gv-glow-b"></div>
      <header class="gv-topbar">
        <div class="topbar-inner">
          <div class="brand">
            <span class="mark" aria-hidden="true">GV</span
            ><span
              >Gentle<span style="color: var(--primary)">Vanguard</span
              ><small data-i18n="appName"></small
            ></span>
          </div>
          <div class="system-state">
            <span id="running-state">0</span> <span data-i18n="runningApps"></span>
          </div>
          <div class="header-actions">
            <button
              id="start-all"
              class="gv-icon-btn"
              title="Arrancar todo"
              aria-label="Arrancar todo"
              onclick="preset('start-all')"
            >
              ⏻
            </button>
            <button
              id="stop-all"
              class="gv-icon-btn preset-stop"
              title="Detener todo"
              aria-label="Detener todo"
              onclick="preset('stop-all')"
            >
              ⏹
            </button>
            <div class="gv-lang-dropdown">
              <button
                id="language-toggle"
                class="gv-icon-btn"
                type="button"
                aria-label="Idioma"
                title="Idioma"
              >
                文A
              </button>
              <div id="language-menu" class="gv-lang-dropdown-menu" hidden>
                <button type="button" data-lang="es">
                  <span>🇪🇸</span><span>Español</span><span class="gv-lang-check"></span>
                </button>
                <button type="button" data-lang="en">
                  <span>🇬🇧</span><span>English</span><span class="gv-lang-check"></span>
                </button>
              </div>
            </div>
            <button
              id="theme"
              class="gv-icon-btn"
              type="button"
              aria-label="Cambiar tema"
              title="Cambiar tema"
            >
              ☀
            </button>
            <button
              class="gv-icon-btn refresh"
              id="refresh"
              aria-label="Actualizar aplicaciones"
              title="Actualizar aplicaciones"
            >
              ↻
            </button>
          </div>
        </div>
      </header>
      <div class="section-heading">
        <h1 class="section-title" data-i18n="appsTitle"></h1>
        <p class="section-sub" data-i18n="appsSubtitle"></p>
      </div>
      <div class="stats" aria-label="Stack status">
        <div class="hstat">
          <strong id="running-count">0</strong><span data-i18n="runningApps"></span>
        </div>
        <div class="hstat">
          <strong id="stopped-count">0</strong><span data-i18n="stoppedApps"></span>
        </div>
        <div class="hstat"><strong>5s</strong><span data-i18n="polling"></span></div>
      </div>
      <div id="error" class="notice" role="alert" hidden></div>
      <section id="apps" class="grid view-fade" aria-live="polite">
        <div class="empty" data-i18n="loading"></div>
      </section>
      <footer class="gv-footer">
        <strong>Gentle-Vanguard</strong> · <span data-i18n="footerTagline"></span> — v3.8.2 · 2026
      </footer>
    </main>
    <script>
      // Surface ANY unexpected error in the UI — a silent failure here would
      // leave the grid stuck at "Cargando aplicaciones…" with no visible cause.
      window.onerror = function (msg, src, line) {
        try {
          show(String(msg) + ' (' + String(src).split('/').pop() + ':' + line + ')');
        } catch {}
        return false;
      };
      window.addEventListener('unhandledrejection', function (ev) {
        show(ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason));
      });
      const I18N = {
        es: {
          title: 'Gentle-Vanguard — Command Center',
          appName: 'Command Center',
          appsTitle: 'Aplicaciones del stack',
          appsSubtitle: 'Controla el ciclo de vida de cada aplicación desde un solo lugar.',
          runningApps: 'en ejecución',
          stoppedApps: 'detenidas',
          polling: 'actualización automática',
          footerTagline: 'Control de ciclo de vida de apps',
          subtitle: 'Inicia, detén y abre las aplicaciones del stack bajo demanda.',
          refresh: '↻ Actualizar',
          startAll: '⏻ Arrancar todo',
          stopAll: '⏹ Detener todo',
          loading: 'Cargando aplicaciones…',
          empty: 'No hay aplicaciones registradas.',
          meta: 'Actualización automática cada 5 segundos · solo loopback',
          running: 'En ejecución',
          stopped: 'Detenida',
          partial: 'Parcial',
          stopConfirm: '¿Detener esta aplicación?',
          stopMany: '¿Detener {n} aplicaciones en ejecución?',
          start: 'Iniciar',
          stop: 'Detener',
          open: 'Abrir',
          error: 'No se pudieron cargar las aplicaciones: ',
          theme: 'Cambiar tema',
        },
        en: {
          title: 'Gentle-Vanguard — Command Center',
          appName: 'Command Center',
          appsTitle: 'Stack applications',
          appsSubtitle: 'Control the lifecycle of every application from one place.',
          runningApps: 'running',
          stoppedApps: 'stopped',
          polling: 'automatic refresh',
          footerTagline: 'App lifecycle control',
          subtitle: 'Start, stop, and open stack applications on demand.',
          refresh: '↻ Refresh',
          startAll: '⏻ Start all',
          stopAll: '⏹ Stop all',
          loading: 'Loading applications…',
          empty: 'No applications registered.',
          meta: 'Automatic refresh every 5 seconds · loopback only',
          running: 'Running',
          stopped: 'Stopped',
          partial: 'Partial',
          stopConfirm: 'Stop this application?',
          stopMany: 'Stop {n} running applications?',
          start: 'Start',
          stop: 'Stop',
          open: 'Open',
          error: 'Could not load applications: ',
          theme: 'Change theme',
        },
      };
      let lang = localStorage.getItem('gv-cc-lang') === 'en' ? 'en' : 'es';
      let theme = localStorage.getItem('gv-cc-theme') === 'light' ? 'light' : 'dark';
      const t = (key) => I18N[lang][key] || I18N.es[key] || key;
      function applyPreferences() {
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach((node) => {
          node.textContent = t(node.dataset.i18n);
        });
        document.querySelectorAll('[data-lang]').forEach((button) => {
          const active = button.dataset.lang === lang;
          button.setAttribute('aria-current', active ? 'true' : 'false');
          button.querySelector('.gv-lang-check').textContent = active ? '✓' : '';
        });
        document.querySelector('#theme').textContent = theme === 'dark' ? '☀' : '🌙';
        document.querySelector('#theme').setAttribute('aria-label', t('theme'));
        document.querySelector('#theme').setAttribute('title', t('theme'));
        document
          .querySelector('#language-toggle')
          .setAttribute('aria-label', lang === 'es' ? 'Idioma' : 'Language');
        document
          .querySelector('#language-toggle')
          .setAttribute('title', lang === 'es' ? 'Idioma' : 'Language');
        document.querySelector('#start-all').setAttribute('aria-label', t('startAll'));
        document.querySelector('#start-all').setAttribute('title', t('startAll'));
        document.querySelector('#stop-all').setAttribute('aria-label', t('stopAll'));
        document.querySelector('#stop-all').setAttribute('title', t('stopAll'));
        document.querySelector('#refresh').setAttribute('aria-label', t('refresh'));
        document.querySelector('#refresh').setAttribute('title', t('refresh'));
      }
      const labels = {
        running: () => t('running'),
        stopped: () => t('stopped'),
        partial: () => t('partial'),
      };
      let busy = '';
      let presetBusy = false;
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      async function load() {
        try {
          const r = await fetch('/api/apps');
          if (!r.ok) throw Error('HTTP ' + r.status);
          render(await r.json());
          document.querySelector('#error').hidden = true;
        } catch (e) {
          show(e.message);
        }
      }
      function show(message) {
        const e = document.querySelector('#error');
        e.textContent = t('error') + message;
        e.hidden = false;
      }
      function render(apps) {
        window.currentApps = apps;
        const running = apps.filter((app) => app.status === 'running').length;
        document.querySelector('#running-state').textContent = running;
        document.querySelector('#running-count').textContent = running;
        document.querySelector('#stopped-count').textContent = apps.length - running;
        const grid = document.querySelector('#apps');
        grid.classList.remove('view-fade');
        void grid.offsetWidth;
        grid.classList.add('view-fade');
        grid.innerHTML =
          apps
            .map(
              (a) =>
                `<article class="card"><div class="card-top"><div><h2>${esc(a.name)}</h2><p class="description">${esc(a.description)}</p></div><span class="badge ${a.status}">${labels[a.status]()}</span></div><div class="processes">${a.processes.map((p) => `<div class="process"><span>${esc(p.name)}</span><span class="${p.alive ? 'up' : 'down'}">${p.alive ? 'PID ' + (p.pid || '—') + ' · Port ' + p.port : 'Port ' + p.port + ' · Offline'}</span></div>`).join('')}</div><div class="actions"><button class="power" ${busy || presetBusy ? 'disabled' : ''} onclick="toggle('${a.id}','${a.status}')" aria-label="${a.status === 'running' ? t('stop') : t('start')} ${esc(a.name)}">⏻ ${a.status === 'running' ? t('stop') : t('start')}</button><button class="open" onclick="window.open('${a.url}','_blank','noopener,noreferrer')" aria-label="${t('open')} ${esc(a.name)}">↗ ${t('open')}</button></div></article>`,
            )
            .join('') || `<div class="empty">${t('empty')}</div>`;
      }
      async function toggle(id, status) {
        if (status === 'running' && !confirm(t('stopConfirm'))) return;
        busy = id;
        try {
          const r = await fetch(
            '/api/apps/' + encodeURIComponent(id) + '/' + (status === 'running' ? 'stop' : 'start'),
            { method: 'POST' },
          );
          if (!r.ok) throw Error('HTTP ' + r.status);
          await load();
        } catch (e) {
          show(e.message);
        } finally {
          busy = '';
          await load();
        }
      }
      async function preset(name) {
        if (name === 'stop-all') {
          const apps = await fetch('/api/apps')
            .then((r) => r.json())
            .catch(() => []);
          const running = apps.filter((app) => app.status === 'running').length;
          if (!confirm(t('stopMany').replace('{n}', running))) return;
        }
        presetBusy = true;
        document.querySelector('#start-all').disabled = true;
        document.querySelector('#stop-all').disabled = true;
        render(window.currentApps || []);
        try {
          const r = await fetch('/api/presets/' + name, { method: 'POST' });
          if (!r.ok) throw Error('HTTP ' + r.status);
          await load();
        } catch (e) {
          show(e.message);
        } finally {
          presetBusy = false;
          document.querySelector('#start-all').disabled = false;
          document.querySelector('#stop-all').disabled = false;
          await load();
        }
      }
      // Bootstrap: initial load + 5s polling (matches the footer promise).
      // Without this the script only defines functions and the grid stays at
      // "Cargando aplicaciones…" forever — no error, no render.
      document.querySelector('#language-toggle').addEventListener('click', () => {
        const menu = document.querySelector('#language-menu');
        menu.hidden = !menu.hidden;
      });
      document.querySelectorAll('[data-lang]').forEach((button) => {
        button.addEventListener('click', () => {
          lang = button.dataset.lang;
          localStorage.setItem('gv-cc-lang', lang);
          applyPreferences();
          document.querySelector('#language-menu').hidden = true;
          void load();
        });
      });
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.gv-lang-dropdown'))
          document.querySelector('#language-menu').hidden = true;
      });
      document.querySelector('#theme').addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('gv-cc-theme', theme);
        applyPreferences();
      });
      document.querySelector('#refresh').addEventListener('click', () => void load());
      applyPreferences();
      void load();
      setInterval(() => void load(), 5000);
    </script>
  </body>
</html>
